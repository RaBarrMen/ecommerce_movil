name: ecommerce_movil
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Firebase ──────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

  # ── Google Sign In ────────────────────────────────────────────────────────
  google_sign_in: ^6.2.1

  # ── State management & Navigation ─────────────────────────────────────────
  provider: ^6.1.2
  go_router: ^14.2.7

  # ── Dependency Injection ──────────────────────────────────────────────────
  get_it: ^8.0.3

  # ── Local storage & Network ───────────────────────────────────────────────
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # ── UI, Images & Animations ───────────────────────────────────────────────
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  animate_do: ^3.3.4
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  smooth_page_indicator: ^1.2.0+3
  pinput: ^5.0.0

  # ── Utilities ─────────────────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.0

  # ── Payment ───────────────────────────────────────────────────────────────
  flutter_stripe: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

